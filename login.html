<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Sistema de Directores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Scripts de la App -->
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box glass-panel">
            <div class="login-header">
                <h2>Sistema de Directores</h2>
                <p>Acceso Seguro</p>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username" placeholder="Ingresa tu usuario">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                
                <div id="login-error" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="btn-primary" id="login-btn">
                    Iniciar Sesión
                </button>
            </form>
            
            <div class="login-footer">
                <p>Distrito Usulután Norte</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.style.display = 'none';
                btn.disabled = true;
                btn.textContent = 'Verificando...';

                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;

                if (!dbClient) {
                    errorDiv.textContent = "Error: Por favor configura Supabase en config.js";
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                    return;
                }

                const result = await login(user, pass);
                if (!result.success) {
                    errorDiv.textContent = result.message;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                }
            });
        });
    </script>
</body>
</html>
